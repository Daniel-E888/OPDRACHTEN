<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>21104727 - form</title>
    <link rel="stylesheet" href="src/css/style.css" />
    <script src="src/scripts/form_validate.js" defer></script>
  </head>
  <body>
    <header>
      <img class="header_bg" src="assets/images/header_bg.jpg" alt="" />
      <nav>
        <ul>
          <li><a class="button" href="index.html">Index</a></li>
          <li><a class="button" href="projects.html">Projecten</a></li>
          <li><a class="button" href="blog.html">Blog</a></li>
          <li><a class="button" href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section>
        <h1>Formulier</h1>
        <form method="post">
          <div class="form-group">
            <label for="name">Naam:</label>
            <input type="text" id="name" aria-describedby="name-error" />
            <span
              class="error-message"
              id="name-error"
              aria-live="polite"
            ></span>
          </div>

          <div class="form-group">
            <label for="email">E-mail:</label>
            <input
              type="email"
              id="email"
              name="email"
              aria-describedby="email-error"
            />
            <span
              class="error-message"
              id="email-error"
              aria-live="polite"
            ></span>
          </div>

          <div class="form-group">
            <label for="message">Bericht:</label>
            <textarea
              id="message"
              name="message"
              aria-describedby="message-error"
            ></textarea>
            <span
              class="error-message"
              id="message-error"
              aria-live="polite"
            ></span>
          </div>
          <span class="success-message"></span>
          <button type="submit">Verzenden</button>
        </form>
      </section>
    </main>
    <footer>
      <p>Gemaakt door Daniël Eekhout (21104727)</p>
    </footer>
  </body>
</html>
